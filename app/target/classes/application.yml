server:
  port: 8084

spring:
  application:
    name: ticketing-fulfillment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/csp
    username: ${DB_USER:ticketing_app}
    password: ${DB_PASSWORD:ticketing_pass}
    hikari:
      schema: ticketing_fulfillment

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: ticketing_fulfillment
        format_sql: true

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 5000
          max-interval: 60000
          multiplier: 2
          max-attempts: 3

ticketing:
  rabbitmq:
    exchange: cine.ticketing_fulfillment
    routing-key:
      ticket-issued: ticketing_fulfillment.ticket-issued.v1
    queue:
      user-registered: ticketing.user-registered
      user-email-changed: ticketing.user-email-changed
      booking-confirmed: ticketing.booking-confirmed
      concession-order-confirmed: ticketing.concession-order-confirmed
      ticket-issued: ticketing.ticket-issued
      dlq: ticketing.dlq

  jwt:
    public-key: ${JWT_PUBLIC_KEY:}
    public-key-file: ${JWT_PUBLIC_KEY_FILE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true