server:
  port: 8084

spring:
  application:
    name: ticketing-fulfillment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/csp
    username: ${DB_USER:ticketing_app}
    password: ${DB_PASSWORD:ticketing_pass}
    hikari:
      schema: ticketing_fulfillment

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: ticketing_fulfillment
        format_sql: true

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: ${RABBITMQ_VHOST:/}  # Use %2F in AMQP URL for default vhost
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 5000
          max-interval: 60000
          multiplier: 2
          max-attempts: 3
        missing-queues-fatal: false
        auto-startup: true
        default-requeue-rejected: false

  # RabbitMQ connection factory config for recovery
  rabbitmq:
    connection-timeout: 10000
    requested-heartbeat: 60

ticketing:
  rabbitmq:
    exchange: cine.events
    routing-key:
      booking-confirmed: cine.booking.booking-confirmed.v1
      ticket-issued: cine.ticketing_fulfillment.ticket-issued.v1
    queue:
      user-registered: ticketing.user-registered
      user-email-changed: ticketing.user-email-changed
      booking-confirmed: ticketing.booking-confirmed.v1
      concession-order-confirmed: ticketing.concession-order-confirmed
      ticket-issued: ticketing.ticket-issued
      dlq: ticketing.dlq
    # Queue declaration at startup (before relay enabled)
    declare-at-startup: true
    # Consumer recovery config
    consumer:
      recovery:
        initial-interval-ms: 1000
        max-interval-ms: 30000
        multiplier: 2.0
        max-attempts: 0  # 0 = unlimited
      cancel:
        log-warn: true

  jwt:
    public-key: ${JWT_PUBLIC_KEY:}
    public-key-file: ${JWT_PUBLIC_KEY_FILE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true