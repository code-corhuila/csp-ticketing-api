# This service only. csp-infra includes this file to compose the platform.
#
# Every setting is passed from the platform environment (the .env of csp-infra). No value and no secret is written
# in this file. Required: the database login (never the migration executor), the broker login and the object storage
# read-only account; the service refuses to start without the JWT public key and the object storage keys.
name: csp-ticketing-api

services:
  ticketing-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?set SPRING_DATASOURCE_URL in .env or in the platform}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?set SPRING_DATASOURCE_USERNAME in .env or in the platform}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env or in the platform}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PUBLIC_KEY_FILE: ${JWT_PUBLIC_KEY_FILE:-}
      SERVICE_SUBJECTS: ${SERVICE_SUBJECTS:-csp-worker}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?set RABBITMQ_HOST in .env or in the platform}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env or in the platform}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?set RABBITMQ_PASS in .env or in the platform}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      OBJECT_STORAGE_URL: ${OBJECT_STORAGE_URL:-http://rustfs:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY in .env or in the platform}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY in .env or in the platform}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-tickets}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      TICKETING_PORTAL_URL: ${TICKETING_PORTAL_URL:-http://localhost:4205}
    expose: ["8084"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
